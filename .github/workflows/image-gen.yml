name: Generate images

on:
  workflow_dispatch:
    inputs:
      job_file:
        description: "Path to job JSON (e.g. jobs/test.json)"
        required: true
  push:
    branches: [main]
    paths:
      - "jobs/**.json"

permissions:
  contents: write

concurrency:
  group: image-gen
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Pick job files
        id: jobs
        env:
          INPUT_JOB: ${{ inputs.job_file }}
        run: |
          if [ -n "$INPUT_JOB" ]; then
            echo "$INPUT_JOB" > /tmp/jobs.txt
          else
            git diff --name-only --diff-filter=AM HEAD~1 HEAD -- 'jobs/*.json' > /tmp/jobs.txt
          fi
          cat /tmp/jobs.txt
      - name: Generate
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          status=0
          while IFS= read -r job; do
            [ -n "$job" ] || continue
            python scripts/generate.py "$job" || status=1
          done < /tmp/jobs.txt
          exit $status
      - name: Commit images
        if: always()
        run: |
          git config user.name "image-bot"
          git config user.email "image-bot@users.noreply.github.com"
          git add output/ || true
          git diff --cached --quiet && exit 0
          git commit -m "Images generated by image-gen workflow"
          git pull --rebase origin main
          git push origin HEAD:main
